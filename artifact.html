<title>Fusion Tungsten Tier Map</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('fw-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<header class="topbar">
  <div class="topbar-row">
    <a class="brand" href="#overview" aria-label="Fusion Tungsten Tier Map home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Fusion Tungsten Tier Map</span></a>

      <div class="search" role="search">
        <input id="q" type="search" placeholder="Search companies, risks, sources…" aria-label="Global search" autocomplete="off" aria-controls="results">

      <button id="themeBtn" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">◐</button>
